<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>הפלגה משפחתית — Family Pirate Ship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700&family=Suez+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #F0D49B 0%, #A87B5A 50%, #5D3F2A 100%);
  }
  #root { min-height: 100vh; display: flex; }

  /* Web-app shell: fills viewport on phones, caps width on desktop with subtle frame */
  .app-shell {
    position: relative;
    width: 100%;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--sand-cream, #FBF1DC);
    overflow: hidden;
  }
  @media (min-width: 720px) {
    body { padding: 24px; }
    #root { min-height: calc(100vh - 48px); }
    .app-shell {
      max-width: 460px;
      min-height: calc(100vh - 48px);
      border-radius: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(93,63,42,0.2);
    }
  }
  .app-shell > div { min-height: 100vh; }
  @media (min-width: 720px) {
    .app-shell > div { min-height: calc(100vh - 48px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="art.jsx"></script>

<script type="text/babel" src="screens-b.jsx"></script>
<script type="text/babel" src="screens-c.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
